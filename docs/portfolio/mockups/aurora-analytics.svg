<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="aurora-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <style>
      .title { font: 52px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #F8FAFC; }
      .subtitle { font: 24px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #CBD5F5; letter-spacing: 3px; }
      .label { font: 22px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1E293B; font-weight: 600; }
      .value { font: 32px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #0F172A; font-weight: 700; }
      .caption { font: 18px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1400" height="900" fill="url(#aurora-bg)" rx="48" />
  <rect x="80" y="120" width="1240" height="660" rx="36" fill="#F8FAFC" />
  <rect x="80" y="120" width="1240" height="140" rx="32" fill="#111827" />
  <text x="160" y="210" class="title">Aurora Analytics</text>
  <text x="160" y="170" class="subtitle">DATA INTELLIGENCE SUITE</text>
  <g transform="translate(160, 300)">
    <rect width="340" height="220" rx="28" fill="#E0F2FE" />
    <text x="40" y="70" class="label">Conversion rate</text>
    <text x="40" y="130" class="value">+28%</text>
    <text x="40" y="170" class="caption">MoM growth on automated insights</text>
    <circle cx="260" cy="110" r="48" fill="#38BDF8" />
    <path d="M232 112 L248 128 L288 88" stroke="#0F172A" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <g transform="translate(560, 300)">
    <rect width="640" height="420" rx="32" fill="#EEF2FF" />
    <polyline points="60,320 200,180 340,260 480,90 580,200" fill="none" stroke="#6366F1" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="60,340 200,260 340,320 480,210 580,260" fill="none" stroke="#0EA5E9" stroke-width="14" stroke-dasharray="24 24" stroke-linecap="round" />
    <rect x="60" y="60" width="140" height="60" rx="18" fill="#6366F1" />
    <text x="80" y="100" class="caption" fill="#F8FAFC">Real-time KPI</text>
  </g>
  <g transform="translate(160, 560)">
    <rect width="340" height="220" rx="28" fill="#FFE4E6" />
    <text x="40" y="80" class="label">Enterprise clients</text>
    <text x="40" y="140" class="value">58</text>
    <text x="40" y="180" class="caption">Active organisations collaborating in workspace</text>
  </g>
  <g transform="translate(560, 740)">
    <rect width="640" height="60" rx="24" fill="#0F172A" />
    <text x="590" y="780" class="subtitle" fill="#38BDF8">AURORA DATA LAB</text>
  </g>
  <g transform="translate(80, 820)">
    <rect x="0" y="0" width="220" height="60" rx="18" fill="#0EA5E9" />
    <text x="28" y="40" class="caption" fill="#F8FAFC">Palette: #0F172A #1E293B #38BDF8 #F8FAFC</text>
  </g>
</svg>
