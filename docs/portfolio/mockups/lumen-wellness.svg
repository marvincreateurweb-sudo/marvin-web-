<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .title { font: 56px 'Futura', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #0F172A; letter-spacing: 4px; }
      .subtitle { font: 24px 'Futura', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #F97316; }
      .body { font: 20px 'Futura', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1F2937; }
      .badge { font: 18px 'Futura', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #FFFFFF; letter-spacing: 2px; }
      .label { font: 18px 'Futura', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #111827; }
    </style>
  </defs>
  <rect width="1400" height="900" fill="#FEF3C7" rx="48" />
  <circle cx="1180" cy="160" r="120" fill="#F97316" opacity="0.15" />
  <circle cx="220" cy="260" r="180" fill="#34D399" opacity="0.18" />
  <text x="200" y="200" class="subtitle">HOLISTIC WELLNESS</text>
  <text x="200" y="270" class="title">LUMEN</text>
  <text x="200" y="330" class="body">Coaching digital pour reconnecter corps, esprit et routine durable.</text>
  <rect x="200" y="370" width="420" height="280" rx="36" fill="#FFFFFF" />
  <text x="240" y="430" class="body">• Coaching respiration guidée</text>
  <text x="240" y="470" class="body">• Planning nutritif personnalisé</text>
  <text x="240" y="510" class="body">• Suivi biométrique intégré</text>
  <text x="240" y="550" class="body">• Programme évolutif sur 12 semaines</text>
  <rect x="240" y="590" width="200" height="60" rx="30" fill="#F97316" />
  <text x="280" y="630" class="badge">COMMENCER</text>
  <g transform="translate(720, 200)">
    <rect width="460" height="520" rx="40" fill="#111827" />
    <circle cx="230" cy="120" r="68" fill="#34D399" />
    <text x="160" y="280" class="subtitle" fill="#FBBF24">RESPIRATION</text>
    <text x="160" y="330" class="body" fill="#F9FAFB">4-7-8 reset pour nuits profondes</text>
    <rect x="80" y="360" width="300" height="12" rx="6" fill="#1F2937" />
    <rect x="80" y="360" width="210" height="12" rx="6" fill="#34D399" />
    <text x="80" y="420" class="body" fill="#F9FAFB">Routine hebdo</text>
    <rect x="80" y="440" width="300" height="12" rx="6" fill="#1F2937" />
    <rect x="80" y="440" width="260" height="12" rx="6" fill="#F97316" />
    <text x="80" y="500" class="body" fill="#F9FAFB">Progression</text>
  </g>
  <g transform="translate(200, 720)">
    <rect width="460" height="60" rx="24" fill="#111827" />
    <text x="40" y="758" class="badge">Palette: #FEF3C7 #F97316 #34D399 #111827</text>
  </g>
</svg>
