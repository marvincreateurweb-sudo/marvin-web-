        *[id*="emergent"],

            opacity: 0 !important;

                        '[id*="emergent"]',
                        '[class*="emergent"]',
                        'a[href*="emergent"]',
                        'div[style*="Made with"]',
                        'div[style*="position:fixed"][style*="bottom"]',
                        '*:contains("Made with")',
                        '*:contains("Emergent")'
                    ];

                        try {
                            document.querySelectorAll(selector).forEach(el => {
                                if (el) el.remove();
                            });
                        } catch(e) {}
                    });
                    
                    // Supprimer par contenu texte
                    document.querySelectorAll('*').forEach(el => {
                        const text = (el.textContent || '').toLowerCase();
                        if (text.includes('made with') || text.includes('emergent')) {
                            el.remove();
                        }
                    });
                }, 500);

                                href: `mailto:${portfolioData.personal.email}`,
                                className: "bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg text-lg font-medium transition-colors inline-flex items-center justify-center gap-2"
                            }, "Demander un devis gratuit ✉️"),
                            React.createElement('a', {
                                href: `tel:${portfolioData.personal.phone.replace(/\s/g, '')}`,
                                className: "border-2 border-gray-300 hover:bg-gray-50 px-8 py-3 rounded-lg text-lg font-medium transition-colors inline-flex items-center justify-center gap-2"
                            }, "Appeler maintenant 📞")
                        )
                    )
                ),

                // Footer
                React.createElement('footer', { className: "bg-gray-900 text-white py-12" },
                    React.createElement('div', { className: "max-w-6xl mx-auto px-6 text-center" },
                        React.createElement('p', { className: "text-lg font-medium mb-4" }, portfolioData.personal.name),
                        React.createElement('p', { className: "text-gray-400 mb-6" }, `${portfolioData.personal.title} • ${portfolioData.personal.location}`),
                        React.createElement('div', { className: "border-t border-gray-700 pt-6" },
                            React.createElement('p', { className: "text-sm text-gray-400" }, `© 2025 ${portfolioData.personal.name}. Tous droits réservés.`)
                        )
                    )
                )
            );
        }

        // Rendu du composant
        const root = createRoot(document.getElementById('root'));
        root.render(React.createElement(Portfolio));

        // Suppression ultra-agressive du badge Emergent - Version finale
        function destroyEmergentBadge() {
            // Bloquer les variables globales problématiques
            if (typeof window !== 'undefined') {
                window.posthog = undefined;
                delete window.posthog;
                window.analytics = undefined;
                delete window.analytics;
            }
            
            // Supprimer tous les éléments suspects
            const suspiciousSelectors = [
                '#emergent-badge',
                '[id*="emergent" i]',
                '[class*="emergent" i]',
                'a[href*="emergent" i]',
                'div[style*="position:fixed"][style*="bottom"]',
                'div[style*="right:20px"]',
                'div[style*="Made with"]',
                'img[src*="emergent"]'
            ];
            
            suspiciousSelectors.forEach(selector => {
                try {
                    document.querySelectorAll(selector).forEach(el => {
                        if (el) {
                            el.style.display = 'none';
                            el.style.visibility = 'hidden';
                            el.style.opacity = '0';
                            el.remove();
                        }
                    });
                } catch(e) {}
            });
            
            // Supprimer par contenu texte (case insensitive)
            document.querySelectorAll('*').forEach(el => {
                if (el.nodeType === 1) { // Element node
                    const text = (el.textContent || el.innerText || '').toLowerCase();
                    const html = (el.innerHTML || '').toLowerCase();
                    
                    if (text.includes('made with') || 
                        text.includes('emergent') || 
                        html.includes('emergent') ||
                        (el.href && el.href.toLowerCase().includes('emergent'))) {
                        el.remove();
                    }
                }
            });
        }
        
        // Exécution immédiate et répétée
        destroyEmergentBadge();
        
        // Exécution après chargement
        document.addEventListener('DOMContentLoaded', destroyEmergentBadge);
        window.addEventListener('load', destroyEmergentBadge);
        
        // Exécution périodique très agressive
        setInterval(destroyEmergentBadge, 100);
        
        // Mutation Observer pour intercepter les ajouts dynamiques
        if (typeof MutationObserver !== 'undefined') {
            const observer = new MutationObserver(() => {
                destroyEmergentBadge();
            });
            
            observer.observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true,
                attributeOldValue: true,
                characterData: true,
                characterDataOldValue: true
            });
        }
    </script>
